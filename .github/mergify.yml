pull_request_rules:
  - name: self-assign PRs
    conditions:
      - -merged
      - -closed
      - "#assignee=0"
    actions:
      assign:
        add_users:
          - "{{ author }}"

  - name: auto-approve owner-authored PRs with label
    conditions:
      - author=cameronraysmith
      - label=author-approved
    actions:
      review:
        type: APPROVE

